trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.11'

steps:

- task: UsePythonVersion@0
  inputs:
    versionSpec: '$(pythonVersion)'
  displayName: 'Use Python 3.11'

- script: |
    cd backend
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: 'Install Backend Dependencies'

- task: ArchiveFiles@2
  displayName: 'Archive Backend'
  inputs:
    rootFolderOrFile: '$(System.DefaultWorkingDirectory)/backend'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/backend.zip'
    replaceExistingArchive: true

- task: PublishBuildArtifacts@1
  displayName: 'Publish Backend Artifact'
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)/backend.zip'
    ArtifactName: 'backend-build'
    publishLocation: 'Container'

- script: |
    curl -X POST \
      "https://costestimatorbackend-cdckbnh5gkdsfmgr.scm.centralindia-01.azurewebsites.net/api/zipdeploy" \
      -u "$(PUBLISH_PROFILE_USERNAME):$(PUBLISH_PROFILE_PASSWORD)" \
      --data-binary @$(Build.ArtifactStagingDirectory)/backend.zip \
      -H "Content-Type: application/octet-stream" \
      --fail \
      --silent \
      --show-error
  displayName: 'Deploy via Zip Deploy'